<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guest Emails - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #667eea;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #667eea;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .export-btn {
            background-color: #04aa23;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .export-btn:hover {
            opacity: 0.8;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Guest Email Notifications</h1>
        <p style="text-align: center; color: #666;">Emails collected from guests who want to be notified about updates</p>

        <div id="email-list">
            <table id="emails-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Submitted On</th>
                    </tr>
                </thead>
                <tbody id="emails-tbody">
                    <!-- Will be populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <button class="export-btn" onclick="exportToCSV()">Export to CSV</button>
        <button class="export-btn" onclick="copyAllEmails()">Copy All Emails</button>
    </div>

    <script>
        // Load and display guest emails
        function loadGuestEmails() {
            const guestEmails = JSON.parse(localStorage.getItem('guestEmails') || '[]');
            const tbody = document.getElementById('emails-tbody');

            if (guestEmails.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-data">No guest emails collected yet</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            guestEmails.forEach((entry, index) => {
                const row = document.createElement('tr');
                const date = new Date(entry.timestamp);
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${entry.username}</td>
                    <td>${entry.email}</td>
                    <td>${date.toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Export to CSV
        function exportToCSV() {
            const guestEmails = JSON.parse(localStorage.getItem('guestEmails') || '[]');

            if (guestEmails.length === 0) {
                alert('No emails to export');
                return;
            }

            let csv = 'Username,Email,Timestamp\n';
            guestEmails.forEach(entry => {
                csv += `${entry.username},${entry.email},${entry.timestamp}\n`;
            });

            // Create download link
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'guest_emails_' + new Date().toISOString().split('T')[0] + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // Copy all emails to clipboard
        function copyAllEmails() {
            const guestEmails = JSON.parse(localStorage.getItem('guestEmails') || '[]');

            if (guestEmails.length === 0) {
                alert('No emails to copy');
                return;
            }

            const emailList = guestEmails.map(entry => entry.email).join(', ');

            navigator.clipboard.writeText(emailList).then(() => {
                alert('All emails copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy emails');
            });
        }

        // Load emails on page load
        window.addEventListener('DOMContentLoaded', loadGuestEmails);
    </script>
</body>
</html>
